name: ci

# REQ-001: make check bei jedem Commit (Push + Pull Request)
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup
        run: make setup
      - name: Check
        run: make check

  packaging-smoke:
    # REQ-817: minimale App (Hello Window) wird auf 3 OS gebaut und gestartet
    # (PyInstaller + pywebview; WKWebView/WebView2/WebKit2GTK). Das
    # Packaging-Risiko fällt so in Woche 1 auf, nicht nach fünf Feature-Steps.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "System dependencies (Linux: WebKit2GTK, Xvfb)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 xvfb
      - name: Install build dependencies
        run: pip install pywebview pyinstaller
      - name: Build hello window (PyInstaller onefile)
        run: pyinstaller --onefile --name sia-hello-window packaging/hello_window.py
      - name: Start hello window (auto-close nach 5 s)
        shell: bash
        env:
          SIA_HELLO_WINDOW_SECONDS: "5"
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run --auto-servernum dist/sia-hello-window
          else
            ./dist/sia-hello-window
          fi
