name: ci

# REQ-001: make check bei jedem Commit (Push + Pull Request)
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup
        run: make setup
      - name: Check
        run: make check
