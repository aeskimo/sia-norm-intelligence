name: ci

# REQ-001: make check bei jedem Commit (Push + Pull Request)
on:
  push:
  pull_request:

jobs:
  check:
    # M8.2 DoD: make check auf 3 OS (nicht nur Linux).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup
        run: make setup
      - name: Check
        run: make check

  packaging-smoke:
    # REQ-817: minimale App (Hello Window) wird auf 3 OS gebaut und gestartet
    # (PyInstaller + pywebview; WKWebView/WebView2/WebKit2GTK). Das
    # Packaging-Risiko fällt so in Woche 1 auf, nicht nach fünf Feature-Steps.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "System dependencies (Linux: WebKit2GTK, Typelibs, PyGObject-Build, Xvfb)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb \
            libgirepository-2.0-dev libcairo2-dev pkg-config
      - name: Install build dependencies
        shell: bash
        run: |
          pip install pywebview pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then
            # pywebview-GTK-Backend: gi (PyGObject) muss in der Build-Umgebung
            # importierbar sein, damit PyInstaller es sammeln kann. Sdist-Build;
            # <3.59, weil 3.59 GLib >= 2.84 braucht (ubuntu-latest = 2.80).
            pip install "PyGObject<3.59"
          fi
      - name: "P0a-Probe: Gtk.init_check-Timing unter Xvfb (reines PyGObject)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Binary-Such: wie lange dauert eine reine GTK-Init (ohne
          # GApplication/WebKit)? Mass für "langsame kalte Init" vs. Hang.
          set +e
          timeout 60 xvfb-run --auto-servernum python3 -c "import time,gi; gi.require_version('Gtk','3.0'); from gi.repository import Gtk; t0=time.monotonic(); Gtk.init_check([]); print('P0a: Gtk.init_check ok nach %.1f s' % (time.monotonic()-t0))"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::P0a: Gtk.init_check rc=$rc (kalte Init >60 s oder Hang)"
            exit "$rc"
          fi
      - name: "P0b-Probe: Gtk.init_check mit NO_AT_BRIDGE=1 (A11y-Brücke skippt)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          NO_AT_BRIDGE: "1"
        run: |
          # Variante ohne ATK-Brücke: isoliert, ob der A11y-Bus-Check
          # (ServiceUnknown auf dem GHA-Runner) der Blockpunkt ist.
          set +e
          timeout 60 xvfb-run --auto-servernum python3 -c "import time,gi; gi.require_version('Gtk','3.0'); from gi.repository import Gtk; t0=time.monotonic(); Gtk.init_check([]); print('P0b: Gtk.init_check (NO_AT_BRIDGE=1) ok nach %.1f s' % (time.monotonic()-t0))"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::P0b: Gtk.init_check mit NO_AT_BRIDGE rc=$rc (A11y ist nicht der Blockpunkt)"
            exit "$rc"
          fi
      - name: "P1-Probe: Gtk.Application activate unter Xvfb (ohne pywebview)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Binary-Such: feuert ``activate`` bei einem plainen Gtk.Application
          # (exakt pywebview-Form, ohne Abstraktion)? Isoliert GHA-Umgebung
          # vs. pywebview-Code vs. PyInstaller-Bundle. Watchdog 45 s +
          # Heartbeat trennen "langsame Init" von echtem Hang.
          python3 -c "import gi; print('[P1] gi-Import OK')"
          set +e
          timeout 90 xvfb-run --auto-servernum python3 packaging/ci_gtk_probe.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "P1 OK: activate feuert unter Xvfb — Umgebung ist nicht der Engpass"
          elif [ "$rc" -eq 124 ]; then
            echo "::error::P1: Prozess-Hang trotz Watchdog (timeout 90 s) — Env-Dump:"
            env | sort | grep -Ei 'display|dbus|xdg|wayland|gdk' || true
            exit 1
          else
            echo "::error::P1: Probe rc=$rc (Details oben im Log)"
            exit "$rc"
          fi
      - name: "P2-Probe: Hello Window aus dem Quellbaum (pywebview, ohne PyInstaller)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIA_HELLO_WINDOW_SECONDS: "5"
          # Shown-Wait toleriert langsame (kalte) Init: 5 s + 40 s = 45 s,
          # konsistent mit P1- watchdog.
          SIA_HELLO_WINDOW_SHOWN_WAIT: "40"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          # Binary-Such: dieselbe App, exakt derselbe Code — nur ohne
          # PyInstaller-Bundle. Isoliert pywebview-Code vs. Packaging.
          set +e
          timeout 90 xvfb-run --auto-servernum python3 packaging/hello_window.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "P2 OK: pywebview (Quellbaum) zeigt das Fenster — PyInstaller ist der Engpass"
          else
            echo "::error::P2: pywebview (Quellbaum) zeigt das Fenster nicht (rc=$rc, Diagnose oben im Log)"
            exit "$rc"
          fi
      - name: Build hello window (PyInstaller onefile)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # gi wird nicht automatisch von PyInstaller erfasst.
            pyinstaller --onefile --collect-all gi --name sia-hello-window packaging/hello_window.py
          else
            pyinstaller --onefile --name sia-hello-window packaging/hello_window.py
          fi
      - name: Start hello window (auto-close nach 5 s)
        shell: bash
        env:
          SIA_HELLO_WINDOW_SECONDS: "5"
          # Shown-Wait toleriert langsame (kalte) Init: 5 s + 40 s = 45 s.
          SIA_HELLO_WINDOW_SHOWN_WAIT: "40"
          # WebKit2GTK ohne GPU (Runner): Compositing abschalten, sonst Crashes.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # timeout: ein Prozess-Hang darf den Job nicht 15 min blockieren.
            # Exit 124 = nicht beendet → Prozess-Tree dumpen (Diagnose).
            set +e
            timeout 90 xvfb-run --auto-servernum dist/sia-hello-window
            rc=$?
            set -e
            if [ "$rc" -eq 124 ]; then
              echo "::error::Hello Window hat sich nicht innerhalb von 90 s beendet (Hang)"
              ps auxf || true
              exit 1
            fi
            exit "$rc"
          else
            ./dist/sia-hello-window
          fi
