name: ci

# REQ-001: make check bei jedem Commit (Push + Pull Request)
on:
  push:
  pull_request:

jobs:
  check:
    # M8.2 DoD: make check auf 3 OS (nicht nur Linux).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup
        run: make setup
      - name: Check
        run: make check

  packaging-smoke:
    # REQ-817: minimale App (Hello Window) wird auf 3 OS gebaut und gestartet
    # (PyInstaller + pywebview; WKWebView/WebView2/WebKit2GTK). Das
    # Packaging-Risiko fällt so in Woche 1 auf, nicht nach fünf Feature-Steps.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "System dependencies (Linux: WebKit2GTK, Typelibs, PyGObject-Build, Xvfb)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb \
            libgirepository-2.0-dev libcairo2-dev pkg-config
      - name: Install build dependencies
        shell: bash
        run: |
          pip install pywebview pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then
            # pywebview-GTK-Backend: gi (PyGObject) muss in der Build-Umgebung
            # importierbar sein, damit PyInstaller es sammeln kann. Sdist-Build;
            # <3.59, weil 3.59 GLib >= 2.84 braucht (ubuntu-latest = 2.80).
            pip install "PyGObject<3.59"
          fi
      - name: "P0a-Probe: Gtk.init_check-Timing unter Xvfb (reines PyGObject)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Binary-Such: wie lange dauert eine reine GTK-Init (ohne
          # GApplication/WebKit)? Mass für "langsame kalte Init" vs. Hang.
          set +e
          timeout 60 xvfb-run --auto-servernum python3 -c "import time,gi; gi.require_version('Gtk','3.0'); from gi.repository import Gtk; t0=time.monotonic(); Gtk.init_check([]); print('P0a: Gtk.init_check ok nach %.1f s' % (time.monotonic()-t0))"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::P0a: Gtk.init_check rc=$rc (kalte Init >60 s oder Hang)"
            exit "$rc"
          fi
      # Root Cause (längst 25-s-GAP im GApplication-Startup unter GHA,
      # bezeugt durch P0a/P1/P1b + Quellcode-Trace, Run 45516863516):
      # GTK-3.24 gtk_application_impl_dbus_startup() holt bei
      # "Session-Bus vorhanden, kein GNOME/Xfce-Session-Manager" den
      # Inhibit-Portal-Proxy MIT Auto-Start (G_DBUS_PROXY_FLAGS_NONE).
      # GLib-2.80 sendet dafür einen sync. StartServiceByName-Call für
      # org.freedesktop.portal.Desktop mit 25-s-Default-Timeout —
      # xdg-desktop-portal kann unter headless CI den Namen nie
      # registrieren → Timeout → GTK schluckt den Error (g_debug) und
      # fährt fort. Fix hier: XDG_RUNTIME_DIR="" → g_bus_get_sync
      # findet keinen Session-Bus mehr → GTK überspringt den ganzen
      # Session-Manager/Portal-Pfad (if (!session) goto out).
      # Production-Linux ist davon nicht betroffen (dort existiert
      # Session-Manager oder laufender Portal).
      - name: "P1-Probe: Gtk.Application activate unter Xvfb (ohne pywebview)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Siehe Root-Cause-Kommentar oben: ohne Session-Bus-Discovery
          # dauert der GApplication-Startup ~0 s statt 25 s.
          XDG_RUNTIME_DIR: ""
          NO_AT_BRIDGE: "1"
        run: |
          # Regressions-Guard für den GApplication-Startup-Pfad
          # (exakt pywebview-Form: Gtk.Application.new(None, 0) +
          # activate). Erwartung: activate feuert in <5 s. Watchdog
          # 45 s + Heartbeat erkennen einen echten Hang trotzdem.
          python3 -c "import gi; print('[P1] gi-Import OK')"
          set +e
          timeout 90 xvfb-run --auto-servernum python3 packaging/ci_gtk_probe.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "P1 OK: activate feuert unter Xvfb — Umgebung ist nicht der Engpass"
          elif [ "$rc" -eq 124 ]; then
            echo "::error::P1: Prozess-Hang trotz Watchdog (timeout 90 s) — Env-Dump:"
            env | sort | grep -Ei 'display|dbus|xdg|wayland|gdk' || true
            exit 1
          else
            echo "::error::P1: Probe rc=$rc (Details oben im Log)"
            exit "$rc"
          fi
      - name: "P2-Probe: Hello Window aus dem Quellbaum (pywebview, ohne PyInstaller)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIA_HELLO_WINDOW_SECONDS: "5"
          # Shown-Wait: 5 s + 20 s = 25 s Toleranz für kalte Init
          # (der 25-s-D-Bus-Stall entfällt durch XDG_RUNTIME_DIR="").
          SIA_HELLO_WINDOW_SHOWN_WAIT: "20"
          # Siehe Root-Cause-Kommentar beim P1-Step.
          XDG_RUNTIME_DIR: ""
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          # Binary-Such: dieselbe App, exakt derselbe Code — nur ohne
          # PyInstaller-Bundle. Isoliert pywebview-Code vs. Packaging.
          set +e
          timeout 90 xvfb-run --auto-servernum python3 packaging/hello_window.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "P2 OK: pywebview (Quellbaum) zeigt das Fenster — PyInstaller ist der Engpass"
          else
            echo "::error::P2: pywebview (Quellbaum) zeigt das Fenster nicht (rc=$rc, Diagnose oben im Log)"
            exit "$rc"
          fi
      - name: Build hello window (PyInstaller onefile)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # gi wird nicht automatisch von PyInstaller erfasst.
            pyinstaller --onefile --collect-all gi --name sia-hello-window packaging/hello_window.py
          else
            pyinstaller --onefile --name sia-hello-window packaging/hello_window.py
          fi
      - name: Start hello window (auto-close nach 5 s)
        shell: bash
        env:
          SIA_HELLO_WINDOW_SECONDS: "5"
          # Shown-Wait: 5 s + 20 s = 25 s Toleranz für kalte Init.
          SIA_HELLO_WINDOW_SHOWN_WAIT: "20"
          # Linux: ohne Session-Bus-Discovery entfällt der 25-s-D-Bus-Stall
          # im GApplication-Startup (siehe Root-Cause-Kommentar beim
          # P1-Step). Auf macOS/Windows werden die Variablen ignoriert.
          XDG_RUNTIME_DIR: ""
          NO_AT_BRIDGE: "1"
          # WebKit2GTK ohne GPU (Runner): Compositing abschalten, sonst Crashes.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # timeout: ein Prozess-Hang darf den Job nicht 15 min blockieren.
            # Exit 124 = nicht beendet → Prozess-Tree dumpen (Diagnose).
            set +e
            timeout 90 xvfb-run --auto-servernum dist/sia-hello-window
            rc=$?
            set -e
            if [ "$rc" -eq 124 ]; then
              echo "::error::Hello Window hat sich nicht innerhalb von 90 s beendet (Hang)"
              ps auxf || true
              exit 1
            fi
            exit "$rc"
          else
            ./dist/sia-hello-window
          fi

  installers:
    # M8.6 (REQ-813): echte Installer auf 3 OS — unsigned (Code-Signing/
    # Notarization ausgelagert, OQ-014; Gatekeeper/SmartScreen-Hinweise in
    # 09 §11). Build (make package) + Launch-Smoke (SIA_WINDOW_SECONDS
    # Auto-Close mit Shown-Event-Backstop) + Seed-Verifikation (9 Pilot-
    # Concepts im User-Datenverzeichnis) + Artifact-Upload.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI-Auto-Close: 8 s nach Fenster-Erzeugung Shown-Event abwarten
      # (30 s Toleranz für kalte Init), dann destroy (REQ-813).
      # (SIA_DATA_DIR/SIA_FAKE_KEYCHAIN mit ${{ runner.temp }} gehören in die
      # Step-level-Env, weil der runner-Kontext in der Job-level-Env nicht
      # erlaubt ist.)
      SIA_WINDOW_SECONDS: "8"
      SIA_WINDOW_SHOWN_WAIT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "System dependencies (Linux: WebKit2GTK, Typelibs, PyGObject-Build, Xvfb)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb \
            libgirepository-2.0-dev libcairo2-dev pkg-config
      - name: "Setup (venv + Abhängigkeiten inkl. PyInstaller)"
        shell: bash
        run: make setup
      - name: "Build deps (Linux: PyGObject <3.59, damit PyInstaller gi sammeln kann)"
        if: runner.os == 'Linux'
        shell: bash
        run: .venv/bin/python -m pip install "PyGObject<3.59"
      - name: "Build Installer (make package)"
        shell: bash
        run: make package
      - name: "Sign macOS .app (M10, REQ-1000: nur bei vars.MACOS_SIGNING_ENABLED)"
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash packaging/sign/macos_sign.sh dist/SIA-Normenassistent.app
      - name: "Sign Windows EXE (M10, REQ-1001: nur bei vars.WINDOWS_SIGNING_ENABLED)"
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: bash packaging/sign/windows_sign.sh dist/SIA-Normenassistent.exe
      - name: "Launch-Smoke (Fenster-Auto-Close, Seed beim ersten Start)"
        shell: bash
        env:
          SIA_DATA_DIR: ${{ runner.temp }}/sia-installer-data
          SIA_FAKE_KEYCHAIN: ${{ runner.temp }}/sia-installer-keychain
          # Linux: ohne Session-Bus-Discovery entfällt der 25-s-D-Bus-Stall
          # im GApplication-Startup (Root-Cause-Kommentar in
          # packaging-smoke). Auf macOS/Windows werden die Variablen ignoriert.
          XDG_RUNTIME_DIR: ""
          NO_AT_BRIDGE: "1"
          # WebKit2GTK ohne GPU (Runner): Compositing abschalten, sonst Crashes.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          mkdir -p "$SIA_DATA_DIR"
          case "$RUNNER_OS" in
            macOS)
              dist/SIA-Normenassistent.app/Contents/MacOS/SIA-Normenassistent
              ;;
            Windows)
              # onefile: erster Start extrahiert nach %TEMP% (kalte Init;
              # der Auto-Close-Timer startet nach der Extraktion im Prozess).
              ./dist/SIA-Normenassistent.exe
              ;;
            Linux)
              set +e
              timeout 240 xvfb-run --auto-servernum \
                dist/SIA-Normenassistent/SIA-Normenassistent
              rc=$?
              set -e
              if [ "$rc" -eq 124 ]; then
                echo "::error::Installer-Smoke: Prozess hat sich nicht innerhalb von 240 s beendet (Hang)"
                ps auxf || true
                exit 1
              fi
              exit "$rc"
              ;;
          esac
      - name: "Seed-Verifikation (9 Pilot-Concepts im User-Datenverzeichnis)"
        shell: bash
        env:
          SIA_DATA_DIR: ${{ runner.temp }}/sia-installer-data
        run: |
          python - <<'PYEOF'
          import os
          import sqlite3
          from pathlib import Path

          db = Path(os.environ["SIA_DATA_DIR"]) / "data" / "catalog" / "catalog.db"
          assert db.is_file(), f"catalog.db fehlt: {db}"
          con = sqlite3.connect(db)
          try:
              n = con.execute("SELECT COUNT(*) FROM concepts").fetchone()[0]
          finally:
              con.close()
          assert n == 9, f"Erwartet 9 Seed-Concepts, gefunden: {n}"
          print(f"Seed OK: {n} Concepts in {db}")
          PYEOF
      - name: "AppImage (Linux: appimagetool 1.9.1, pinned + sha256-geprüft)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIA_DATA_DIR: ${{ runner.temp }}/sia-installer-data
          SIA_FAKE_KEYCHAIN: ${{ runner.temp }}/sia-installer-keychain
          # ubuntu-latest ist x86_64 (explizit, damit appimagetool die
          # Architektur nicht raten muss).
          ARCH: "x86_64"
          XDG_RUNTIME_DIR: ""
          NO_AT_BRIDGE: "1"
        run: |
          curl -fsSL -o appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          # AppDir (Payload = KOPIE des onedir-Builds; appimagetool folgt
          # Symlinks in der Architecture-Erkennung nicht und würde den
          # absoluten Symlink unverändert übernehmen → kaputter AppImage)
          rm -rf build/appimage
          mkdir -p build/appimage
          cat > build/appimage/AppRun <<'APPRUN'
          #!/bin/sh
          exec "$APPDIR/SIA-Normenassistent/SIA-Normenassistent" "$@"
          APPRUN
          chmod +x build/appimage/AppRun
          cp packaging/sia-normenassistent.desktop build/appimage/
          cp packaging/icon/app-icon-512.png build/appimage/SIA-Normenassistent.png
          cp -a dist/SIA-Normenassistent build/appimage/
          # Extract-and-Run: braucht keinen FUSE-Support auf dem Runner.
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            build/appimage "dist/SIA-Normenassistent-x86_64.AppImage"
          ls -la dist/
          # Headless-Smoke des AppImage (healthz ohne Token; Seed idempotent).
          # Extraktion des ~200-MB-Containers kann dauern (120 s Polling).
          APPIMAGE_EXTRACT_AND_RUN=1 dist/SIA-Normenassistent-x86_64.AppImage \
            --headless --port 8877 &
          app_pid=$!
          code=""
          for _ in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8877/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          kill "$app_pid" 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error::AppImage-Smoke: healthz lieferte kein 200 (letzter Wert: '$code')"
            exit 1
          fi
          echo "AppImage-Smoke OK (healthz 200)"
      - name: "Installer-Upload (Artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
