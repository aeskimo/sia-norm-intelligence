[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sia-norm-intelligence"
version = "0.1.0"
description = "Referenzimplementierung: SIA-Normen als semantische Objekte mit Fundstelle und Aussageklasse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sni.core --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
